name: Build and publish PyPI wheel

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test macOS arm64 wheel
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: arm64

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match the package version v$version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Version tags must point to a commit on main."
            exit 1
          fi

      - name: Build the Metal wheel
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun -sdk macosx --find metal
          xcrun -sdk macosx --find metallib
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/scimetal-dist" .

      - name: Test the installed wheel
        run: |
          wheels=("$RUNNER_TEMP"/scimetal-dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" || "${wheels[0]}" != */scimetal-*-py3-none-macosx_15_0_arm64.whl ]]; then
            echo "Expected one SciMetal wheel tagged py3-none-macosx_15_0_arm64."
            exit 1
          fi

          python -m pip install twine
          python -m twine check --strict "${wheels[0]}"
          python -m venv "$RUNNER_TEMP/scimetal-test"
          test_python="$RUNNER_TEMP/scimetal-test/bin/python"
          "$test_python" -m pip install "${wheels[0]}[test]"
          "$test_python" -m pip check

          cd "$RUNNER_TEMP"
          unset PYTHONPATH SCIMETAL_LIBRARY
          "$test_python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          import numpy as np
          import scipy.fft
          import scimetal
          from scimetal import _native

          installed = Path(sys.prefix).resolve()
          package = Path(scimetal.__file__).resolve().parent
          assert installed in package.parents
          assert _native._library_path().resolve() == package / "libscimetal.dylib"
          assert scimetal.__version__ == version("scimetal")

          rng = np.random.default_rng(0)
          values = rng.standard_normal(32768, dtype=np.float32)
          with scimetal.device("gpu"), scimetal.precision("fast"):
              transformed = scimetal.fft.rfft(values)
              assert scimetal.last_route().engine == "gpu", scimetal.explain()
          np.testing.assert_allclose(transformed, scipy.fft.rfft(values), rtol=1e-4, atol=5e-4)
          PY
          SCIMETAL_TEST_INSTALLED=1 "$test_python" -m pytest "$GITHUB_WORKSPACE/tests/python" -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scimetal-macos-arm64-wheel
          path: ${{ runner.temp }}/scimetal-dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish tested wheel to PyPI
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.event.created && !github.event.deleted && github.repository == 'tabulai/SciMetal'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scimetal-macos-arm64-wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Keep private repository and workflow details out of public provenance.
          attestations: false
